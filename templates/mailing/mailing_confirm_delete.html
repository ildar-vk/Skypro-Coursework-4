{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Удалить рассылку?</h2>
    <p>Вы уверены, что хотите удалить рассылку <strong>{{ object.message.theme }}</strong> с {{ object.start_time }} по {{ object.end_time }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailing:mailing_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
