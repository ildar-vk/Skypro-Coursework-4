{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Мои сообщения</h2>
    <a href="{% url 'mailing:message_create' %}" class="btn btn-primary mb-3">Создать сообщение</a>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Тема</th>
                <th>Тело</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for msg in messages %}
            <tr>
                <td>{{ msg.theme }}</td>
                <td>{{ msg.body|truncatechars:100 }}</td>
                <td>
                    <a href="{% url 'mailing:message_update' msg.pk %}" class="btn btn-sm btn-warning">Изменить</a>
                    <a href="{% url 'mailing:message_delete' msg.pk %}" class="btn btn-sm btn-danger">Удалить</a>
                 </td>
            </tr>
            {% empty %}
            <tr><td colspan="3">Нет сообщений. <a href="{% url 'mailing:message_create' %}">Создайте первое</a>.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
